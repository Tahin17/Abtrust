name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts app
      - name: Test
        run: pytest -q

  validation-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Quick Monte Carlo validation (5% of the full simulation budget)
        run: abtrust validate --scale 0.05 --out /tmp/validation --no-figures
      - name: Case study runs
        run: python scripts/case_study.py

  app-smoke:
    runs-on: ubuntu-latest
    env:
      ABTRUST_RUN_STREAMLIT_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,app]"
      - name: Real Streamlit AppTest smoke
        run: pytest -q tests/test_streamlit_integration.py
