[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abtrust"
version = "0.3.0"
description = "A/B test analysis you can trust: CUPED, delta-method ratio metrics, sequential methods with explicit assumptions and SRM checks, each validated by simulation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MD. Nafiul Haque Nafee" }]
keywords = ["ab-testing", "experimentation", "statistics", "cuped", "sequential-testing", "causal-inference"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
app = ["matplotlib>=3.7", "streamlit>=1.50"]
dev = ["pytest>=7.4", "ruff>=0.5", "matplotlib>=3.7"]

[project.scripts]
abtrust = "abtrust.cli:main"

[project.urls]
Homepage = "https://github.com/KingKarim5/abtrust"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: Monte Carlo checks that take a few seconds"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]
